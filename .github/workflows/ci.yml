name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  validate-and-test:
    name: Validate Data, Lint & Headless Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and validate data
        run: |
          pip install jsonschema ruff
          python3 tools/validate_data.py

      - name: Lint Python tools with ruff
        run: |
          ruff check tools/

      - name: Download Godot 4.3-stable (linux.x86_64)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          rm -f godot.zip

      - name: Run headless tests
        run: |
          ./godot --headless --path . -s res://tests/run_tests.gd

  # TODO(M0-ditunda): Build APK ditunda atas keputusan pemilik proyek.
  # Alasan: preset Android saat ini set min_sdk tapi gradle_build=false.
  # Aktifkan kembali setelah salah satu dari dua perbaikan dipilih:
  #   (a) set gradle_build/use_gradle_build=true dan siapkan Android SDK
  #       + NDK + export templates di runner, ATAU
  #   (b) hapus override min_sdk (pakai default Godot untuk debug).
  # JANGAN aktifkan kembali tanpa uji lokal dulu.
  build-android:
    if: false
    name: Build Android Debug APK
    needs: validate-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Godot 4.3-stable and Export Templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          rm -f godot.zip

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates templates.tpz

      - name: Configure Android SDK and Debug Keystore for Godot
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"
          cat <<EOF > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          ./godot --headless --export-debug "Android" build/zarah-debug.apk

      - name: Log APK size
        run: |
          ls -lh build/zarah-debug.apk
          stat --printf="APK Debug Size: %s bytes\n" build/zarah-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zarah-debug-apk
          path: build/zarah-debug.apk
          if-no-files-found: error
